<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>С Днём Рождения!</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050816;
            color: #fff;
            overflow: hidden;
            transition: background 0.3s;
        }

        @media (prefers-color-scheme: light) {
            body {
                background: #f0f0f5;
                color: #111;
            }
            .overlay-box {
                background: rgba(255, 255, 255, 0.85) !important;
                color: #111 !important;
            }
            .btn-primary {
                background: #222 !important;
                color: #fff !important;
            }
            .btn-primary:hover {
                background: #444 !important;
            }
            .nav-btn {
                background: rgba(0, 0, 0, 0.08) !important;
                color: #222 !important;
            }
            .nav-btn:hover {
                background: rgba(0, 0, 0, 0.18) !important;
            }
            .slide-counter {
                color: #222 !important;
            }
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            transition: opacity 0.5s, visibility 0.5s;
        }
        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .overlay-box {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 30px;
            padding: 40px 35px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }
        .overlay-box h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }
        .overlay-box p {
            font-size: 17px;
            opacity: 0.7;
            margin-bottom: 24px;
        }
        .btn-primary {
            background: #ff6b9d;
            border: none;
            color: #1a1a2e;
            padding: 14px 40px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-primary:hover {
            transform: scale(1.05);
        }

        .timer-display {
            font-size: 90px;
            font-weight: 900;
            line-height: 1;
            margin: 10px 0 6px;
        }
        .timer-label {
            font-size: 15px;
            opacity: 0.5;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .main-content {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.7s, visibility 0.7s;
            padding: 20px;
        }
        .main-content.show {
            opacity: 1;
            visibility: visible;
        }

        .birthday-title {
            font-size: clamp(40px, 10vw, 80px);
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.5s, transform 0.5s;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.25);
        }
        .birthday-title.show {
            opacity: 1;
            transform: scale(1);
        }
        .birthday-title.hide {
            opacity: 0;
            transform: scale(1.1);
            transition: opacity 0.7s, transform 0.7s;
        }

        /* ===== КАРУСЕЛЬ ===== */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            max-width: 820px;
            overflow: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            min-height: 380px;
            padding: 0 20px; /* ← ОТСТУПЫ ДЛЯ КРАЙНИХ КАРТОЧЕК */
        }

        .carousel-track {
            display: flex;
            gap: 20px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 10px 0;
            align-items: center;
            will-change: transform;
        }

        .photo-card {
            min-width: 250px;
            height: 330px;
            flex-shrink: 0;
            perspective: 1000px;
            cursor: pointer;
            border-radius: 18px;
            transition: transform 0.3s;
            align-self: center;
        }
        .photo-card:hover {
            transform: scale(1.02);
        }

        .photo-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .photo-card.flipped .photo-card-inner {
            transform: rotateY(180deg);
        }

        .photo-card-front,
        .photo-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 18px;
            overflow: hidden;
        }
        .photo-card-front {
            background: #1a1a2e;
        }
        .photo-card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-card-back {
            background: linear-gradient(145deg, #ff6b9d, #ff3b5c);
            transform: rotateY(180deg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            color: #fff;
            font-size: 19px;
            font-weight: 700;
            line-height: 1.5;
        }
        .photo-card-back span {
            font-size: 38px;
            display: block;
            margin-bottom: 6px;
        }

        .photo-card.video-card {
            cursor: default;
        }
        .photo-card.video-card .photo-card-front {
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .photo-card.video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-card.video-card .video-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 14px 18px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        /* ===== НАВИГАЦИЯ ===== */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: 0.25s;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.6;
        }
        .nav-btn:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
            background: rgba(255, 255, 255, 0.18);
        }
        .nav-btn.prev {
            left: 12px;
        }
        .nav-btn.next {
            right: 12px;
        }
        .nav-btn.disabled {
            opacity: 0.2 !important;
            pointer-events: none !important;
        }

        .slide-counter {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            z-index: 10;
            letter-spacing: 0.5px;
        }

        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0.4;
            letter-spacing: 0.5px;
            z-index: 5;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .hint.hidden {
            opacity: 0;
        }

        @media (max-width: 700px) {
            .photo-card {
                min-width: 200px;
                height: 270px;
            }
            .carousel-wrapper {
                min-height: 300px;
                padding: 0 10px;
            }
            .nav-btn {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }
        }
        @media (max-width: 450px) {
            .photo-card {
                min-width: 160px;
                height: 220px;
            }
            .carousel-wrapper {
                min-height: 240px;
                padding: 0 6px;
            }
            .nav-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .nav-btn.prev {
                left: 6px;
            }
            .nav-btn.next {
                right: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay">
        <div class="overlay-box" id="overlayBox">
            <h2>⏳ Щас будет таймер</h2>
            <p>Приготовься к поздравлению!</p>
            <button class="btn-primary" id="startBtn">ПОНЯТНО</button>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="birthday-title" id="birthdayTitle">🎉 С Днём Рождения! 🎉</div>

        <div class="carousel-wrapper" id="carouselWrapper">
            <div class="carousel-track" id="carouselTrack"></div>
            <button class="nav-btn prev" id="prevBtn">‹</button>
            <button class="nav-btn next" id="nextBtn">›</button>
            <div class="slide-counter" id="slideCounter">1 / 1</div>
        </div>

        <div class="hint" id="hint">👆 Нажми на фото — переверни!</div>
    </div>

    <script>
        const slidesData = [
            { text: 'Самый тёплый день в году! ☀️' },
            { text: 'Ты — наше солнышко! 🌟' },
            { text: 'Пусть сбываются мечты! ✨' },
            { text: 'Счастья, здоровья, любви! ❤️' },
            { text: 'Ты лучший(ая) на свете! 🏆' },
            { text: '🎬 Видео-поздравление!' }
        ];

        const imageSrc = 'images/1.png';
        const videoSrc = 'images/video.mp4';

        const overlay = document.getElementById('overlay');
        const overlayBox = document.getElementById('overlayBox');
        const startBtn = document.getElementById('startBtn');
        const mainContent = document.getElementById('mainContent');
        const birthdayTitle = document.getElementById('birthdayTitle');
        const track = document.getElementById('carouselTrack');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('slideCounter');
        const hint = document.getElementById('hint');
        const wrapper = document.getElementById('carouselWrapper');

        let current = 0;
        let total = slidesData.length;
        let autoTimer = null;
        let isAuto = false;
        let videoEnded = false;

        function buildSlides() {
            track.innerHTML = '';
            slidesData.forEach((data, idx) => {
                const isVideo = idx === slidesData.length - 1;
                const card = document.createElement('div');
                card.className = 'photo-card' + (isVideo ? ' video-card' : '');
                card.dataset.index = idx;

                const inner = document.createElement('div');
                inner.className = 'photo-card-inner';

                const front = document.createElement('div');
                front.className = 'photo-card-front';

                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = videoSrc;
                    video.muted = false;
                    video.playsInline = true;
                    video.preload = 'auto';
                    video.setAttribute('controls', 'true');
                    video.setAttribute('controlslist', 'nodownload');
                    front.appendChild(video);

                    const label = document.createElement('div');
                    label.className = 'video-label';
                    label.textContent = '🎬 Нажми play';
                    front.appendChild(label);

                    video.addEventListener('play', () => stopAuto());
                    video.addEventListener('ended', () => {
                        videoEnded = true;
                        stopAuto();
                        updateButtons();
                    });
                } else {
                    const img = document.createElement('img');
                    img.src = imageSrc;
                    img.alt = 'Фото';
                    img.loading = 'lazy';
                    front.appendChild(img);
                }

                const back = document.createElement('div');
                back.className = 'photo-card-back';
                back.innerHTML = `<div><span>❤️</span><br>${data.text}</div>`;

                inner.appendChild(front);
                inner.appendChild(back);
                card.appendChild(inner);

                if (!isVideo) {
                    card.addEventListener('click', function(e) {
                        e.stopPropagation();
                        this.classList.toggle('flipped');
                    });
                }

                track.appendChild(card);
            });

            total = slidesData.length;
            updateCounter();
            setTimeout(updateSlider, 50);
            updateButtons();
        }

        function updateSlider() {
            const cards = track.querySelectorAll('.photo-card');
            if (!cards.length) return;
            const wrapperWidth = wrapper.offsetWidth;
            const cardWidth = cards[0].offsetWidth + 20;
            const offset = -current * cardWidth + (wrapperWidth - cardWidth) / 2;
            track.style.transform = `translateX(${offset}px)`;
            updateCounter();
            updateButtons();
        }

        function updateCounter() {
            counter.textContent = `${current + 1} / ${total}`;
        }

        function updateButtons() {
            const isFirst = current === 0;
            const isLast = current === total - 1;
            prevBtn.classList.toggle('disabled', isFirst);
            nextBtn.classList.toggle('disabled', isLast || videoEnded);
        }

        function goTo(idx) {
            if (idx < 0) idx = 0;
            if (idx >= total) idx = total - 1;
            if (idx === current) return;
            current = idx;
            updateSlider();
            if (idx === total - 1) stopAuto();
        }

        function next() {
            if (current < total - 1) goTo(current + 1);
        }

        function prev() {
            if (current > 0) goTo(current - 1);
        }

        function startAuto() {
            stopAuto();
            isAuto = true;
            videoEnded = false;
            autoTimer = setInterval(() => {
                if (!isAuto || videoEnded) return;
                if (current >= total - 1) {
                    stopAuto();
                    return;
                }
                next();
            }, 3000);
        }

        function stopAuto() {
            isAuto = false;
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
            updateButtons();
        }

        let timerInterval = null;

        function startTimer() {
            let sec = 5;
            overlayBox.innerHTML = `
                <div class="timer-display" id="timerDisplay">${sec}</div>
                <div class="timer-label">СЕКУНД</div>
            `;
            timerInterval = setInterval(() => {
                sec--;
                const d = document.getElementById('timerDisplay');
                if (d) d.textContent = sec;
                if (sec <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    overlay.classList.add('hidden');
                    showMain();
                }
            }, 1000);
        }

        function showMain() {
            mainContent.classList.add('show');
            setTimeout(() => birthdayTitle.classList.add('show'), 300);
            setTimeout(() => {
                birthdayTitle.classList.remove('show');
                birthdayTitle.classList.add('hide');
            }, 3500);
            setTimeout(() => {
                buildSlides();
                setTimeout(startAuto, 500);
                hint.classList.remove('hidden');
                setTimeout(() => hint.classList.add('hidden'), 6000);
            }, 4000);
        }

        startBtn.addEventListener('click', startTimer);
        prevBtn.addEventListener('click', prev);
        nextBtn.addEventListener('click', next);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prev();
            if (e.key === 'ArrowRight') next();
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (mainContent.classList.contains('show')) updateSlider();
            }, 200);
        });
    </script>
</body>
</html>
